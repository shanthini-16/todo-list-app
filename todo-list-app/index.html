<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📝 My To-Do List</h1>
        
        <!-- Task Counter -->
        <div id="taskCounter" style="text-align: center; margin-bottom: 15px; padding: 8px; background: #f0f0f0; border-radius: 10px; font-weight: bold; color: #667eea;">
            📋 0 tasks remaining
        </div>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter a new task...">
            <button id="addBtn">➕ Add</button>
        </div>
        
        <ul id="taskList"></ul>
        
        <!-- Clear All Button - Light color -->
        <button id="clearAllBtn" style="width: 100%; margin-top: 20px; background: linear-gradient(135deg, #e0e0e0 0%, #cccccc 100%); color: #666; border: none; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.3s ease;">
            🗑️ Clear All Tasks
        </button>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
